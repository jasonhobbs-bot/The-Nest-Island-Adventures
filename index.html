function beep(freq=500,dur=.12,type='sine',vol=.06){if(!sound)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch(e){}}

function show(html){overlay.innerHTML='<div class="panel">'+html+'</div>';overlay.classList.add('open')};function hide(){overlay.classList.remove('open');overlay.innerHTML='';modal=''};

function mapMenu(first=false){scene='map';input={left:false,right:false,up:false,down:false};controls.innerHTML='';promptEl.textContent='Explore the island • Pick an adventure on the map';let cards=missions.map(([id,name,desc,ico],i)=>`<button class="mission" data-mission="${id}"><strong>${ico} ${name} ${progress[id]?' <em>★</em>':''}</strong><small>${desc}</small></button>`).join('');show(`<div class="eyebrow">The Wild Robot • Chapters 33–40</div><h1>THE NEST<br><span style="color:#a9efce">Island Adventures</span></h1><p class="lead">An original illustrated mini-adventure inspired by Roz and Brightbill’s island. Grow a garden, make friends, explore water, and take flight.</p><div class="badges"><span class="badge">🕹️ 5 adventures</span><span class="badge">📱 iPad ready</span><span class="badge">⭐ ${Object.values(progress).filter(Boolean).length}/5 discoveries</span></div><p style="margin-bottom:5px;color:#ffe09b;font-weight:900">Choose your grade</p><div class="options" id="grades">${[2,3,4,5].map(g=>`<button class="btn ${g===grade?'selected':''}" data-grade="${g}">Grade ${g}</button>`).join('')}</div><p style="margin-bottom:7px;color:#ffe09b;font-weight:900">Choose an island adventure</p><div class="cardrow">${cards}</div><div class="actions"><button class="btn secondary" id="howBtn">How to play</button><button class="btn secondary" id="resetBtn">Reset progress</button><button class="btn primary" id="exploreBtn">Explore the Island ✨</button></div><p class="small">Progress saves automatically on this device. No sign-in, account, or internet connection needed after loading.</p>`);overlay.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>start(b.dataset.mission));overlay.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{grade=+b.dataset.grade;save();updateHud();mapMenu()});overlay.querySelector('#exploreBtn').onclick=hide;overlay.querySelector('#howBtn').onclick=how;overlay.querySelector('#resetBtn').onclick=()=>{if(confirm('Clear your saved stars, function how(){show(`<div class="eyebrow">Explorer's guide</div><h2>Welcome to the Island!</h2><p class="lead">Tap the illustrated locations on the map to begin. Each adventure plays differently. Use the big on-screen buttons or keyboard arrows on a computer. Grade 2 is gentler; Grade 5 has more challenges.</p><p class="lead">🌱 <b>Garden:</b> choose a plant, then tap soil plots to plant it. 💧 <b>Pond:</b> steer Brightbill past logs and gather lily stars. 🐿️ <b>Friends:</b> watch and repeat a growing animal sound sequence. 🪶 <b>Flight:</b> tap FLAP or Space to glide between branches. ⛵ <b>Ship:</b> scan the sea and identify objects from the clues.</p><p class="small">This is an unofficial classroom-created learning activity, not affiliated with the author or publisher.</p><div class="actions"><button class="btn primary" id="back">Back to map</button></div>`);document.getElementById('back').onclick=()=>mapMenu()}
function start(id){hide();scene=id;mode={time:0,hearts:3,stars:0,won:false};particles=[];if(id==='garden')initGarden();if(id==='pond')initPond();if(id==='friends')initFriends();if(id==='flight')initFlight();if(id==='ship')initShip();}
function win(id,extra=''){if(mode.won)return;mode.won=true;let newStar=!progress[id];progress[id]=true;points+=newStar?100:25;save();updateHud();chime();burst(W*.5,H*.45,32);setTimeout(()=>show(`<div class="eyebrow">Island discovery complete</div><h1>⭐ Wonderful!</h1><p class="lead">${extra||'You helped Roz and Brightbill find another piece of their island story.'}</p><p class="lead">${newStar?'You earned a new island star and 100 discovery points!':'You earned 25 replay points!'}</p><div class="actions"><button class="btn secondary" id="again">Play Again</button><button class="btn primary" id="next">Island Map →</button></div>`),700);setTimeout(()=>{let a=document.getElementById('again'),b=document.getElementById('next');if(a)a.onclick=()=>start(id);if(b)b.onclick=()=>mapMenu()},710)}

function control(items){controls.innerHTML='';items.forEach(([label,key])=>{let b=document.createElement('button');b.textContent=label;b.setAttribute('aria-label',label);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);input[key]=true;beep(340,.025)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{e.preventDefault();input[key]=false});controls.appendChild(b)})}
addEventListener('keydown',e=>{let key=({'ArrowLeft':'left','a':'left','ArrowRight':'right','d':'right','ArrowUp':'up','w':'up',' ':'up','ArrowDown':'down','s':'down'})[e.key];if(key){e.preventDefault();if(!input[key]&&scene==='flight'&&key==='up')flap();input[key]=true}if(e.key==='Escape')mapMenu()});addEventListener('keyup',e=>{let key=({'ArrowLeft':'left','a':'left','ArrowRight':'right','d':'right','ArrowUp':'up','w':'up',' ':'up','ArrowDown':'down','s':'down'})[e.key];if(key)input[key]=false});document.getElementById('homeBtn').onclick=mapMenu;document.getElementById('soundBtn').onclick=()=>{sound=!sound;updateHud();save();beep(700)};
const path=(pts,color,width=2,fill=false)=>{cx.beginPath();pts.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));if(fill){cx.closePath();cx.fillStyle=color;cx.fill()}else{cx.strokeStyle=color;cx.lineWidth=width;cx.stroke()}};

function cloud(x,y,s=1){cx.save();cx.globalAlpha=.5;circle(x,y,21*s,'#fff9db');circle(x+22*s,y-10*s,28*s,'#fff9db');circle(x+48*s,y,21*s,'#fff9db');rect(x-4*s,y,58*s,15*s,'#fff9db',8*s);cx.restore()}
function tree(x,y,s=1){rect(x-10*s,y-5*s,20*s,100*s,'#6b5541',5*s);circle(x-20*s,y-21*s,37*s,'#245d4b');circle(x+17*s,y-35*s,34*s,'#2b7458');circle(x,y-61*s,34*s,'#3b8f66');circle(x-13*s,y-57*s,20*s,'#55a973')}
function flower(x,y,s=1,c='#ffc0a2'){rect(x-2*s,y,4*s,22*s,'#34744e',2);for(let i=0;i<5;i++)circle(x+Math.cos(i*6.283/5)*9*s,y+Math.sin(i*6.283/5)*9*s,7*s,c);circle(x,y,6*s,'#ffe8a0')}

function mapDraw(){sky();hills();for(let i=0;i<11;i++)tree(i*W/10-30,H*.73+Math.sin(i*5)*20,.5+.2*(i%3));rect(0,H*.84,W,H*.2,'#2c6854');for(let i=0;i<30;i++)flower((i*79)%W,H*(.86+(i%4)*.028),.4,['#f8c3a0','#ffe1a1','#c5b9e6'][i%3]);nest(W*.47,H*.65,Math.min(W/700,1.1));roz(W*.26,H*.76,Math.min(W/1000,.8));bird(W*.63,H*.76,.8);cx.save();cx.strokeStyle='#ffdf9c';cx.lineWidth=5;cx.setLineDash([12,16]);cx.beginPath();cx.moveTo(W*.13,H*.71);cx.bezierCurveTo(W*.4,H*.3,W*.73,H*.78,W*.9,H*.43);cx.stroke();cx.restore();let spots=mapSpots();spots.forEach(([id,x,y,t,ico])=>{circle(x,y,33,'#0c3447cf');circle(x,y,29,'#e5f0c6');circle(x,y,26,'#2d6e69');text(ico,x,y,25);text(progress[id]?'★':'',x+23,y-24,25,'#ffe3a0');labelBox(t,x,y+54)});text('THE WILD ISLAND',W*.5,H*.20,Math.min(36,W*.055),'#fff4d5');text('Tap a location to begin',W*.5,H*.26,Math.min(16,W*.028),'#f5fff2')}

function initGarden(){selectedPlant=0;gardenPlots=[];for(let row=0;row<3;row++)for(let col=0;col<5;col++)gardenPlots.push([col,row]);mode.planted=0;promptEl.textContent='Design the garden! Select a plant below, then tap an empty soil plot.';controls.innerHTML='';plants.forEach((p,i)=>{let b=button(p,()=>{selectedPlant=i;beep(520+i*40,.07);[...controls.children].forEach((x,k)=>x.style.outline=k===i?'3px solid #ffe6a0':'none')});b.style.cssText='pointer-events:auto;min-width:48px;min-height:55px;font-size:24px;padding:5px;';controls.appendChild(b)});controls.firstChild.style.outline='3px solid #ffe6a0';let done=button('Finish ✓',()=>{if(garden.length>=Math.max(6,grade*2)){win('garden','The Nest is surrounded by a flourishing garden! You made a welcoming place for the island animals.')}else toast('Plant at least '+Math.max(6,grade*2)+' flowers first!')},'primary');done.style.pointerEvents='auto';controls.appendChild(done)}
function gardenCoords(){let s=Math.min(W/900,H/700,1.15);let tw=85*s,th=46*s;return{tw,th,x:W*.5,y:H*.60,s}}
function drawGarden(){sky();hills(1);for(let i=0;i<8;i++)tree(i*W/7-20,H*.7,.8);nest(W*.73,H*.52,Math.min(.9,W/1000));roz(W*.13,H*.72,Math.min(.8,W/1000));rect(0,H*.70,W,H*.30,'#48745a');let {tw,th,x,y}=gardenCoords();gardenPlots.forEach(([col,row],idx)=>{let px=x+(col-2)*tw+(row-1)*tw*.24,py=y+(row-1)*th*1.5;cx.save();cx.translate(px,py);cx.scale(1,.52);circle(0,0,tw*.44,'#5c4938');circle(0,0,tw*.37,'#9c7150');cx.restore();let planted=garden.find(a=>a.idx===idx);if(planted)text(plants[planted.plant],px,py-17,Math.min(47,tw*.55));else text('＋',px,py-10,25,'#e9caa4')});labelBox('🌿 '+garden.length+' plants growing',W/2,Math.max(112,H*.35),true)}
function plantAt(x,y){let {tw,th,x:ox,y:oy}=gardenCoords();let closest=-1,dist=999;gardenPlots.forEach(([col,row],idx)=>{let px=ox+(col-2)*tw+(row-1)*tw*.24,py=oy+(row-1)*th*1.5;let d=Math.hypot((x-px), (y-(py-12))*1.5);if(d<dist){dist=d;closest=idx}});if(dist<tw*.53){let f=garden.find(a=>a.idx===closest);if(f){f.plant=selectedPlant;toast('Garden updated!')}else{garden.push({idx:closest,plant:selectedPlant});points+=3;updateHud();toast('A new plant is growing!');}beep(540+selectedPlant*40,.13);burst(x,y,8);save()}}
function waterBase(){sky();hills(2);rect(0,H*.49,W,H*.51,grad('#4b9f9d','#1b667e',H*.49,H*.51));for(let i=0;i<15;i++){let x=((i*151+clock*16)%(W+100))-50,y=H*(.56+(i%5)*.088);cx.strokeStyle='#d2f0c665';cx.lineWidth=2;cx.beginPath();cx.ellipse(x,y,25,4,0,0,6.28);cx.stroke()}}
function initPond(){mode.x=W*.25;mode.y=H*.72;mode.vx=0;mode.vy=0;mode.goal=Math.max(5,grade+4);mode.items=[];mode.spawn=0;mode.hearts=3;mode.stars=0;promptEl.textContent=`Swim with Brightbill! Collect ${mode.goal} lily stars • Avoid driftwood.`;control([['◀','left'],['▲','up'],['▼','down'],['▶','right']])}
function pondUpdate(dt){if(mode.won)return;mode.time+=dt;mode.vx=((+input.right)-(+input.left))*220;mode.vy=((+input.down)-(+input.up))*205;mode.x=clamp(mode.x+mode.vx*dt,30,W-30);mode.y=clamp(mode.y+mode.vy*dt,H*.51,H*.88);mode.spawn-=dt;if(mode.spawn<=0){mode.spawn=Math.max(.45,1.3-grade*.12);mode.items.push({x:W+60,y:rand(H*.54,H*.86),kind:Math.random()<.60?'star':'log',hit:false})}mode.items.forEach(it=>{it.x-= (100+grade*23)*dt;if(Math.hypot(it.x-mode.x,it.y-mode.y)<33&&!it.hit){it.hit=true;if(it.kind==='star'){mode.stars++;burst(it.x,it.y,10);beep(760,.08)}else{mode.hearts--;beep(180,.18,'square',.04);toast('Watch out for floating logs!')}if(mode.stars>=mode.goal)win('pond','Brightbill swam bravely across the pond and collected all the lily stars!');if(mode.hearts<=0)lose('Steer around the driftwood and collect lily stars. You can do it!')}});mode.items=mode.items.filter(a=>a.x>-70&&!a.hit)}
function pondDraw(){waterBase();for(let i=0;i<7;i++){let x=(i*197)%W,y=H*.52+(i%3)*53;circle(x,y,22,'#5c9f68');circle(x+7,y-7,8,'#f6dca7')}mode.items.forEach(it=>{if(it.kind==='star'){circle(it.x,it.y,22,'#357c68');text('✦',it.x,it.y,30,'#ffeab0')}else{cx.save();cx.translate(it.x,it.y);cx.rotate(.1);rect(-31,-13,62,26,'#725a41',10);circle(-26,-3,7,'#937b5d');cx.restore()}});bird(mode.x,mode.y,1.3,mode.vx/900);labelBox('✦ '+mode.stars+'/'+mode.goal+'   ♥ '.repeat(mode.hearts),W*.5,Math.max(111,H*.38),true)}
let sequence=[],guesses=[],phase='watch',flash=-1,friendBtns=[];const friends=['🐿️','🦉','🦊','🦌'];
function initFriends(){mode.round=0;mode.goal=grade+1;sequence=[];guesses=[];phase='watch';flash=-1;promptEl.textContent='Listen and watch your forest friends • Repeat their pattern!';controls.innerHTML='';friends.forEach((f,i)=>{let b=button(f,()=>friendTap(i));b.style.cssText='pointer-events:auto;min-width:60px;min-height:60px;font-size:26px;padding:7px';controls.appendChild(b);friendBtns.push(b)});setTimeout(nextFriend,500)}
function nextFriend(){if(scene!=='friends'||mode.won)return;mode.round++;sequence.push(rnd(4));guesses=[];phase='watch';promptEl.textContent=`Round ${mode.round}/${mode.goal} • Watch the forest friends!`;playPattern(0)}
function playPattern(i){if(scene!=='friends'||mode.won)return;if(i>=sequence.length){flash=-1;phase='repeat';promptEl.textContent=`Your turn! Repeat ${sequence.length} forest sounds in order.`;return}flash=sequence[i];beep([390,490,590,690][flash],.3,'sine',.07);setTimeout(()=>{flash=-1;setTimeout(()=>playPattern(i+1),260)},540)}
function friendTap(i){if(scene!=='friends'||phase!=='repeat'||mode.won)return;beep([390,490,590,690][i],.19);guesses.push(i);flash=i;setTimeout(()=>{flash=-1},260);if(sequence[guesses.length-1]!==i){phase='wait';toast('Not quite! Watch the pattern again.');beep(170,.2,'triangle');guesses=[];setTimeout(()=>{phase='watch';playPattern(0)},900);return}if(guesses.length===sequence.length){burst(W*.5,H*.46,12);if(mode.round>=mode.goal)win('friends','You remembered your forest friends and helped Brightbill feel at home!');else{phase='wait';setTimeout(nextFriend,820)}}}
function friendsDraw(){sky();hills(3);for(let i=0;i<7;i++)tree(i*W/6-20,H*.7,.8);rect(0,H*.79,W,H*.25,'#2c6753');friends.forEach((f,i)=>{let x=W*(.14+i*.24),y=H*.58+Math.sin(clock*2+i)*4;circle(x,y,Math.min(64,W*.10),flash===i?'#ffe0a6':'#d5e7c4');circle(x,y,Math.min(57,W*.09),'#245e60');text(f,x,y,Math.min(55,W*.08));if(flash===i){cx.strokeStyle='#ffe6aa';cx.lineWidth=7;cx.beginPath();cx.arc(x,y,Math.min(70,W*.11),0,6.29);cx.stroke()}});labelBox('Memory round '+mode.round+' / '+mode.goal,W*.5,H*.37,true);text(phase==='watch'?'WATCH & LISTEN':'REPEAT THE PATTERN',W*.5,H*.79,Math.min(19,W*.035),'#fff3c8')}
function initFlight(){mode.x=W*.19;mode.y=H*.5;mode.vy=0;mode.time=0;mode.distance=0;mode.goal=grade*320+600;mode.hearts=3;mode.stars=0;mode.pipes=[];mode.spawn=1.1;mode.invulnerable=0;promptEl.textContent='Brightbill’s first flight! Tap FLAP or press Space • Fly past branches.';controls.innerHTML='';let b=document.createElement('button');b.textContent='🪽 FLAP';b.style.cssText='pointer-events:auto;min-width:165px;font-size:20px';b.onclick=flap;controls.appendChild(b)}
function flap(){if(scene!=='flight'||mode.won)return;mode.vy=-265;beep(600,.06);burst(mode.x-15,mode.y+12,4)}
function flightUpdate(dt){if(mode.won)return;let speed=120+grade*20;mode.time+=dt;mode.distance+=speed*dt;mode.invulnerable=Math.max(0,mode.invulnerable-dt);mode.vy+=610*dt;mode.y+=mode.vy*dt;if(mode.y<45||mode.y>H-40){mode.y=clamp(mode.y,45,H-40);mode.vy=mode.y<50?90:-200;if(!mode.invulnerable){mode.invulnerable=1.1;mode.hearts--;beep(220,.12);if(mode.hearts<=0)lose('Keep Brightbill between the treetops! Tap FLAP to stay airborne.')}}mode.spawn-=dt;if(mode.spawn<=0){mode.spawn=Math.max(.9,1.8-grade*.12);let gap=Math.max(130,H*.34);mode.pipes.push({x:W+60,center:rand(H*.32,H*.67),gap,hit:false,star:false})}mode.pipes.forEach(p=>{p.x-=speed*dt;if(!p.hit&&Math.abs(p.x-mode.x)<38&&Math.abs(mode.y-p.center)>p.gap/2-12){p.hit=true;if(!mode.invulnerable){mode.invulnerable=1.1;mode.hearts--;beep(190,.12);toast('A branch! Keep flying.');if(mode.hearts<=0)lose('Watch the branches and time your flaps carefully.')}}if(!p.star&&p.x<mode.x-35){p.star=true;mode.stars++;beep(740,.05)}});mode.pipes=mode.pipes.filter(p=>p.x>-90);if(mode.distance>=mode.goal)win('flight','Brightbill learned to trust his wings and flew above the island trees!')}
function flightDraw(){sky();hills(4);for(let i=0;i<13;i++)tree(((i*123-clock*20)%(W+150)+W+150)%(W+150)-80,H*.8,.6+(i%3)*.3);mode.pipes.forEach(p=>{rect(p.x-15,0,30,p.center-p.gap/2,'#5b573e',12);rect(p.x-15,p.center+p.gap/2,30,H,'#5b573e',12);for(let k=0;k<4;k++){circle(p.x+Math.sin(k)*20,p.center-p.gap/2-35-k*42,26,'#407b50');circle(p.x+Math.sin(k)*20,p.center+p.gap/2+35+k*42,26,'#407b50')}});bird(mode.x,mode.y,1.3,clamp(mode.vy/1000,-.3,.5));labelBox('🪽 '+Math.round(mode.distance/mode.goal*100)+'% sky crossed   ♥ '+mode.hearts,W*.5,H*.20,true)}
const clues=[['A dark shape that moves across the horizon.','ship','Ship'],['The bright circle that lights the sky.','sun','Sun'],['White mist drifting above the water.','cloud','Cloud'],['A piece of land rising from the sea.','island','Island'],['A group of seabirds soaring overhead.','birds','Birds']];let shipTargets=[];
function initShip(){mode.round=0;mode.goal=grade+1;mode.target=null;mode.found=0;mode.errors=0;mode.shipLocked=false;shipTargets=[{id:'ship',x:.78,y:.58},{id:'sun',x:.19,y:.21},{id:'cloud',x:.51,y:.23},{id:'island',x:.23,y:.68},{id:'birds',x:.63,y:.40}];promptEl.textContent='Observe the horizon carefully • Tap the object described in the clue.';controls.innerHTML='';nextShip()}
function nextShip(){if(mode.round>=mode.goal)return win('ship','Roz and Brightbill observed the horizon carefully and noticed a mysterious ship at sea!');mode.round++;mode.shipLocked=false;let key=clues[(mode.round-1)%clues.length];mode.target=key[1];promptEl.textContent=`Clue ${mode.round}/${mode.goal}: ${key[0]}`;}
function shipDraw(){sky(true);hills(5);rect(0,H*.53,W,H*.47,grad('#71b6b8','#195d73',H*.53,H*.47));for(let i=0;i<16;i++){cx.strokeStyle='#d6f7dc7d';cx.lineWidth=2;cx.beginPath();let x=((i*141+clock*13)%(W+100))-50,y=H*.56+(i%7)*H*.055;cx.ellipse(x,y,30,4,0,0,6.28);cx.stroke()}circle(W*.19,H*.21,Math.min(45,W*.065),'#ffea9b');cloud(W*.51,H*.23,1.6);path([[W*.08,H*.69],[W*.19,H*.57],[W*.27,H*.61],[W*.36,H*.69]],'#466c5c',2,true);for(let k=0;k<3;k++)tree(W*(.17+k*.05),H*.61,Math.min(.65,W/1100));let x=W*.78,y=H*.58;path([[x-67,y],[x+65,y],[x+39,y+37],[x-35,y+37]],'#3a4851',2,true);rect(x-5,y-68,5,70,'#46565a');path([[x,y-65],[x+41,y-8],[x,y-8]],'#e8e1c0',1,true);path([[x-4,y-45],[x-39,y-5],[x-4,y-5]],'#f8edc9',1,true);for(let k=0;k<3;k++){cx.strokeStyle='#e8e1bd';cx.lineWidth=4;cx.beginPath();cx.moveTo(W*.60+k*22,H*.41+k*2);cx.quadraticCurveTo(W*.61+k*22,H*.39+k*2,W*.62+k*22,H*.41+k*2);cx.stroke()}shipTargets.forEach(t=>{let ax=t.x*W,ay=t.y*H;cx.strokeStyle='#f5e9b888';cx.lineWidth=2;cx.setLineDash([5,8]);cx.beginPath();cx.arc(ax,ay,Math.min(W*.065,42)+Math.sin(clock*2)*3,0,6.28);cx.stroke();cx.setLineDash([])});labelBox('🔎 '+mode.round+'/'+mode.goal+' clues   •   '+mode.errors+' misses',W*.5,H*.79,true)}
function shipTap(x,y){if(mode.shipLocked)return;let near=null,dmin=Infinity;shipTargets.forEach(t=>{let d=Math.hypot((x-t.x*W),(y-t.y*H));if(d<dmin){dmin=d;near=t}});if(dmin>Math.max(45,Math.min(W*.075,65)))return;if(near.id===mode.target){mode.shipLocked=true;beep(820,.1);burst(x,y,17);toast('Excellent observation!');setTimeout(()=>{if(scene==='ship'&&!mode.won)nextShip()},420)}else{mode.errors++;beep(180,.17);toast('Look more closely at the clue!')}}
function canvasTap(e){if(overlay.classList.contains('open'))return;const x=e.clientX,y=e.clientY;if(scene==='map'){let found=mapSpots().find(t=>Math.hypot(t[1]-x,t[2]-y)<48);if(found)start(found[0])}else if(scene==='garden')plantAt(x,y);else if(scene==='ship'&&!mode.won)shipTap(x,y);else if(scene==='flight')flap()};canvas.addEventListener('pointerdown',canvasTap);
function loop(ms){let dt=Math.min(.035,((ms-last)||16)/1000);last=ms;clock+=dt;cx.clearRect(0,0,W,H);if(scene==='map')mapDraw();else if(scene==='garden')drawGarden();else if(scene==='pond'){pondUpdate(dt);pondDraw()}else if(scene==='friends')friendsDraw();else if(scene==='flight'){flightUpdate(dt);flightDraw()}else if(scene==='ship')shipDraw();tickParticles(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);mapMenu(true);
</script></body></html>
